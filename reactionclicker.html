<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Amaar Arcade - Reaction Clicker</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #box {
      width: 150px;
      height: 150px;
      background: #e91e63;
      margin: 50px auto;
      display: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Amaar Arcade - Reaction Clicker</h1>
  <p>Click the box as fast as you can when it appears.</p>
  <button id="startBtn">Start</button>
  <div id="box"></div>
  <p id="result"></p>

  <script>
    const startBtn = document.getElementById('startBtn');
    const box = document.getElementById('box');
    const result = document.getElementById('result');
    let startTime;

    startBtn.onclick = () => {
      result.textContent = "";
      box.style.display = "none";
      const delay = Math.random() * 3000 + 1000; // 1–4 seconds
      setTimeout(() => {
        startTime = Date.now();
        box.style.display = "block";
      }, delay);
    };

    box.onclick = () => {
      const reaction = Date.now() - startTime;
      box.style.display = "none";
      result.textContent = "Your reaction time: " + reaction + " ms";
    };
  </script>
</body>
</html>
